# Local infrastructure. Application services are added in later phases.
# Copy .env.example to .env first (or rely on the defaults below).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local traces and metrics (phase 10, ADR 0015): docker compose --profile observability up -d
  # UI http://localhost:18888; apps export with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317.
  # No sign-in: bound to loopback only, for local development. Data lives in memory only.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2
    profiles: ["observability"]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"

volumes:
  postgres-data:
