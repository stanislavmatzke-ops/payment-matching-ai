name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Recorded model answers only (no key, no cost). Fails the build when any configuration drops
      # below 99 % precision of automatic matches or matches an injection (ADR 0008).
      - name: Eval gate (replay over evals/dataset/gold-v1)
        run: dotnet run --project tools/Eval.Cli --configuration Release --no-build -- --mode replay --report out/eval/report.md

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: out/eval/report.md
          if-no-files-found: ignore

      - name: Sample data is reproducible
        run: |
          dotnet run --project tools/DataGen.Cli --configuration Release --no-build -- --seed 42 --out data/sample
          dotnet run --project tools/DataGen.Cli --configuration Release --no-build -- --seed 2005 --payments 1000 --out legacy/golden/seed-2005/input
          git diff --exit-code -- data/sample legacy/golden/seed-2005/input

  legacy-golden-master:
    name: Legacy golden master (Free Pascal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build legacy and run it on the golden sets
        run: |
          bash legacy/run-legacy.sh data/sample legacy/golden/seed-42/legacy_matches.csv
          bash legacy/run-legacy.sh legacy/golden/seed-2005/input legacy/golden/seed-2005/legacy_matches.csv

      - name: Golden master unchanged
        run: git diff --exit-code -- legacy/golden

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The CLI scans the whole history on every run. (gitleaks-action builds an invalid
      # commit range on the first push of a new repository and then scans nothing.)
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan full git history
        run: gitleaks git --redact --verbose .
